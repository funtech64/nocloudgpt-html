<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoCloudGPT Quote Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">
<div class="mx-auto max-w-5xl px-6 py-16">
<h1 class="text-5xl font-black">Build a private AI quote.</h1>
<p class="mt-6 text-lg text-slate-300">This page will evolve into a guided NoCloudGPT recommendation engine for Ollama deployments.</p>
<form class="mt-12 grid gap-6 rounded-3xl border border-slate-800 bg-slate-900 p-10">
<div>
<label class="block text-sm font-bold uppercase tracking-widest text-cyan-300">Primary use case</label>
<select class="mt-3 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white">
<option>General chatbot</option>
<option>Private office assistant</option>
<option>Code generation</option>
<option>Reasoning and research</option>
<option>Vision and OCR</option>
</select>
</div>
<div>
<label class="block text-sm font-bold uppercase tracking-widest text-cyan-300">Deployment target</label>
<select class="mt-3 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white">
<option>AWS Lightsail</option>
<option>Ubuntu server</option>
<option>Proxmox cluster</option>
<option>Dedicated GPU server</option>
</select>
</div>
<div>
<label class="block text-sm font-bold uppercase tracking-widest text-cyan-300">Preferred model family</label>
<select class="mt-3 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white">
<option>DeepSeek</option>
<option>Llama</option>
<option>Qwen</option>
<option>Mistral</option>
<option>Gemma</option>
<option>Phi</option>
</select>
</div>
<button class="rounded-2xl bg-cyan-300 px-6 py-4 text-lg font-black text-slate-950 hover:bg-cyan-200">Generate recommendation</button>
</form>
</div>
</body>
</html>
