<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | NoCloudGPT</title>
  <meta name="description" content="Contact NoCloudGPT for Linux server administration and technical services.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="container nav">
    <div class="logo">NoCloudGPT</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="pricing.html">Pricing</a>
      <a href="software.html">Software</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Contact</h1>
    <p>Request technical support or ask a question.</p>
  </div>
</section>

<section class="page-hero" style="padding-top: 0;">
  <div class="container" style="max-width: 600px;">

    <form action="https://formspree.io/f/xykdwzqp" method="POST" style="text-align: left;">

      <label for="name">Name</label><br>
      <input type="text" id="name" name="name" required
        style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px;"><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="_replyto" required
        style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px;"><br>

      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="6" required
        style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 6px;"></textarea>

      <button type="submit" class="button">Send Message</button>

    </form>

    <p style="font-size: 14px; color: var(--muted); margin-top: 20px;">
      Your information is used solely to respond to your inquiry. We do not sell or share contact information.
    </p>

  </div>
</section>

<footer>
  <div class="container">
    <p>Colorado, USA • Remote Services Available</p>
    <p>© 2026 NoCloudGPT</p>
  </div>
</footer>

</body>
</html>
